# Microns icon metadata
# Per-icon source of truth for AI selection within the microns set (issue #25).
#
# Linked from the root index at /icon-sets.yaml. Prefer this set over UI icons only
# when the control must stay legible at micron scale (spaces 12px or smaller).
#
# Seeded from Figma (2026-07-06), curated against glyph meaning and RHDS
# icon guidelines (familiar meanings; close ≠ delete).
#
# Schema per icon:
#   name: Figma component name (rh-micron-*)
#   icon: @rhds/icons / <rh-icon> icon id (set="microns")
#   description: what the glyph depicts and when to use it
#   accepted_metaphors: concepts this icon IS appropriate for
#   rejected_metaphors: concepts this icon should NOT be used for

set: microns
source:
  type: figma
  library: Red Hat Icon Library
  page: Microns
  retrieved: 2026-07-06
  curated: 2026-07-20

icons:
  - name: rh-micron-close
    icon: close
    description: "An X for dismissing or closing UI chrome (dialogs, drawers, banners, chips)."
    accepted_metaphors:
      - close
      - dismiss
      - clear field
      - remove chip
      - cancel overlay
    rejected_metaphors:
      - delete
      - trash
      - destroy
      - error
      - incomplete
      - stop
      - minimize

  - name: rh-micron-checkmark
    icon: checkmark
    description: "A standalone checkmark for success or confirmation outside a checkbox."
    accepted_metaphors:
      - success
      - complete
      - done
      - confirmed
      - valid
      - approved
    rejected_metaphors:
      - checkbox selected
      - add
      - download
      - next
      - save file

  - name: rh-micron-checkbox-complete
    icon: checkbox-complete
    description: "Outlined checkbox with a check — selected or completed checkbox state."
    accepted_metaphors:
      - checkbox selected
      - checked
      - multi-select on
      - task checked in a list
    rejected_metaphors:
      - success badge
      - form submitted
      - radio selected
      - close
      - delete

  - name: rh-micron-checkbox-complete-fill
    icon: checkbox-complete-fill
    description: "Filled checkbox with a check — emphasized selected or completed checkbox state."
    accepted_metaphors:
      - checkbox selected
      - checked
      - multi-select on
      - task checked in a list
