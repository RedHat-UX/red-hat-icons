  # Sort icons: arrow direction + value order. Prefer the pair that matches
  # the control's arrow affordance; do not pick by ascending/descending alone.
  - name: rh-micron-sort-up-small-to-large
    icon: sort-up-small-to-large
    description: "Sort control with up arrow; order small→large (A→Z, low→high)."
    accepted_metaphors:
      - sort ascending with up arrow
      - A to Z with up arrow
      - low to high with up arrow
    rejected_metaphors:
      - sort-up-large-to-small
      - sort-down-small-to-large
      - sort-down-large-to-small
      - filter
      - swap
      - unsorted

