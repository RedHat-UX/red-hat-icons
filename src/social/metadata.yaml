# Social icon set documentation
# Descriptions, accepted use cases, and rejected use cases for the Social set of icons designed by the Brand team.
# Linked from /icon-sets.yaml.
#
# Sourced by auditing the Brand team's Figma icon library, curated against platform brand guidelines
# and RHDS icon guidelines.
#
# Schema:
#   name: Icon name (rh-social-*)
#   icon: @rhds/icons / <rh-icon> icon id (set="social")
#   description: what the icon depicts and when to use it
#   accepted_metaphors: use cases this icon is appropriate for
#   rejected_metaphors: use cases this icon should not be used for

set: social
source:
  type: figma
  library: Red Hat Icon Library
  page: Social
  retrieved: 2026-07-06
  curated: 2026-07-23

icons:
  # ── Email ──────────────────────────────────────────────────────────────────
  - name: rh-social-email
    icon: email
    description: "Envelope — links to an email address or mailto action."
    accepted_metaphors:
      - email contact
      - send email
      - mailto link
      - contact via email
      - newsletter signup
    rejected_metaphors:
      - internal messaging
      - chat
      - notification
      - inbox (product feature)

  - name: rh-social-email-square
    icon: email-square
    description: "Envelope in a square container — badge format for email contact links."
    accepted_metaphors:
      - email contact
      - send email
      - mailto link
      - contact via email
      - newsletter signup
    rejected_metaphors:
      - internal messaging
      - chat
      - notification
      - inbox (product feature)

