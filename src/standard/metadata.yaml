# Standard icon set documentation
# Descriptions, accepted use cases, and rejected use cases for the Standard set of icons designed by the Brand team.
# Linked from /icon-sets.yaml.
#
# Sourced by auditing the Brand team's Figma icon library, curated against industry icon
# meanings, and RHDS icon guidelines.
#
# Sections follow the Figma page organization.
#
# Schema:
#   name: Icon name (rh-icon-*)
#   icon: @rhds/icons / <rh-icon> icon id (set="standard")
#   description: what the icon depicts and when to use it
#   accepted_metaphors: use cases this icon is appropriate for
#   rejected_metaphors: use cases this icon should not be used for

set: standard
source:
  type: figma
  library: Red Hat Icon Library
  page: Standard icons
  retrieved: 2026-07-06
  curated: 2026-07-21

icons:
  # ── Buildings and industries ───────────────────────────────────────────────
  - name: rh-icon-barn
    icon: barn
    description: "A farm barn — represents agriculture, rural industries, and farming contexts."
    accepted_metaphors:
      - agriculture
      - farming
      - food production
      - rural industry
      - storage
    rejected_metaphors:
      - general storage (use storage icon)
      - data storage (use storage or datacenter icon)

  - name: rh-icon-capitol-building
    icon: capitol-building
    description: "A domed government capitol building — represents government institutions, legislation, and public sector organizations."
    accepted_metaphors:
      - government
      - public sector
      - legislation
      - federal institutions
      - congress or parliament
      - policy
    rejected_metaphors:
      - general office building (use office or city icon)

  - name: rh-icon-city
    icon: city
    description: "A skyline with office towers — represents urban environments, metropolitan areas, and city-scale operations."
    accepted_metaphors:
      - urban environments
      - enterprise
      - geographic region
    rejected_metaphors:
      - single building (use office or home icon)

  - name: rh-icon-government
    icon: government
    description: "A classical building with columns — represents government institutions, legal bodies, and public administration."
    accepted_metaphors:
      - government agencies
      - public administration
      - legal institutions
      - compliance and regulation
      - public sector IT
    rejected_metaphors:
      - federal legislation specifically (use capitol-building icon)

  - name: rh-icon-home
    icon: home
    description: "A house — represents home, personal workspace, working from home, and residential contexts."
    accepted_metaphors:
      - home office
      - remote work
      - residential deployments
      - work-from-home
    rejected_metaphors:
      - home screen or homepage (use home or home-fill icon in UI icon set)

  - name: rh-icon-industry
    icon: industry
    description: "A factory with smokestacks — represents industrial manufacturing, large-scale production, and heavy industry."
    accepted_metaphors:
      - manufacturing
      - industrial operations
      - production facilities
      - factory automation
      - industrial IoT
    rejected_metaphors:
      - oil and gas specifically (use oil-and-gas icon)
      - farming (use barn icon)

  - name: rh-icon-insurance
    icon: insurance
    description: "A clipboard with a shield — represents insurance services, risk assurance, and coverage."
    accepted_metaphors:
