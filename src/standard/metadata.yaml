  # ── Harvey Balls ───────────────────────────────────────────────────────────
  # Harvey balls are circular percentage-fill indicators used in comparison charts.
  # Use to represent completion percentages, capability ratings, and feature comparisons.
  # Do not use for progress bars (use a bar chart or progress component instead).
  - name: rh-icon-harvey-ball-0
    icon: harvey-ball-0
    description: "A Harvey ball showing 0% fill — represents zero completion, no capability, or a completely unfilled indicator."
    accepted_metaphors:
