  # ── Status ─────────────────────────────────────────────────────────────────
  # Status icons communicate the current state of a system, process, resource,
  # or connection. Use them consistently so users can identify states at a
  # glance without reading labels. Pair with color tokens and accessible labels.

  # — System power and process state ——————————————————————————————————————————

  - name: rh-ui-icon-asleep
    icon: asleep
    description: "Moon with Zzz — a system, device, or service is in a sleep or standby state."
    accepted_metaphors:
      - sleep or standby
      - hibernating
      - idle low-power state
      - suspended service
    rejected_metaphors:
      - powered off (use off)
      - dark mode (use dark-mode)
      - paused process (use pending or not-started)

  - name: rh-ui-icon-asleep-fill
    icon: asleep-fill
    description: "Filled moon with Zzz — sleep or standby state (filled variant)."
    accepted_metaphors:
      - sleep or standby (filled)
    rejected_metaphors:
      - powered off (use off)
      - dark mode (use dark-mode)

  - name: rh-ui-icon-in-progress
    icon: in-progress
    description: "Spinning or partial circle — a task or process is actively running."
    accepted_metaphors:
      - in progress
      - loading or processing
      - running task
      - pending execution
    rejected_metaphors:
      - in-progress with passing check (use in-progress-check)
      - not yet started (use not-started)
      - complete (use check-circle)

  - name: rh-ui-icon-in-progress-check
    icon: in-progress-check
    description: "Partial circle with a check — a process is running and passing its health checks."
    accepted_metaphors:
      - running and healthy
      - in-progress and validated
      - active and passing
    rejected_metaphors:
      - simple in-progress without validation (use in-progress)
      - complete (use check-circle)
      - error while running (use error)

  - name: rh-ui-icon-not-started
    icon: not-started
    description: "Empty circle — a task or item that has not yet begun."
    accepted_metaphors:
      - not started
      - backlog or queued
      - pending (not yet active)
      - open item
    rejected_metaphors:
      - actively processing (use in-progress)
      - paused or waiting (use pending)
      - complete (use check-circle)

  - name: rh-ui-icon-not-started-fill
    icon: not-started-fill
    description: "Filled empty circle — not-started state (filled variant)."
    accepted_metaphors:
      - not started (filled)
    rejected_metaphors:
      - in-progress (use in-progress)
      - complete (use check-circle)

  - name: rh-ui-icon-off
    icon: off
