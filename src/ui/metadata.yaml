  # ── View type ──────────────────────────────────────────────────────────────
  # View type icons toggle between display modes in a UI. Use them on controls
  # that let users switch how content is rendered — not for layout decisions
  # made by the system or developer.

  - name: rh-ui-icon-columns
    icon: columns
    description: "Two or three vertical columns — switch to a multi-column layout view."
    accepted_metaphors:
      - multi-column view
      - column layout toggle
      - split into columns
      - side-by-side layout
    rejected_metaphors:
      - tabular data (use table)
      - sidebar toggle (use sidebar)
      - grid of cards (use thumbnail-view-large or thumbnail-view-small)

  - name: rh-ui-icon-columns-fill
    icon: columns-fill
    description: "Filled two or three vertical columns — emphasized multi-column layout view."
    accepted_metaphors:
      - multi-column view (active state)
      - column layout toggle
    rejected_metaphors:
      - tabular data (use table)
      - sidebar toggle (use sidebar)

  - name: rh-ui-icon-list
    icon: list
    description: "Horizontal lines stacked — switch to a list or row-based view."
    accepted_metaphors:
      - list view
      - row view
      - linear display
      - feed or queue display
    rejected_metaphors:
      - menu (use menu-bars)
      - table with columns (use table)
      - card grid (use thumbnail-view-large or thumbnail-view-small)

  - name: rh-ui-icon-sidebar
    icon: sidebar
    description: "Panel with a left rail — toggle the navigation sidebar open or closed."
    accepted_metaphors:
      - sidebar toggle
      - show or hide navigation rail
      - navigation panel
    rejected_metaphors:
      - content panel (use panel-open or panel-close)
      - drawer (use open-drawer-left or open-drawer-right)
      - columns layout (use columns)

  - name: rh-ui-icon-sidebar-fill
    icon: sidebar-fill
    description: "Filled panel with a left rail — emphasized sidebar toggle, typically active state."
    accepted_metaphors:
      - sidebar visible (active state)
      - navigation rail shown
    rejected_metaphors:
      - content panel (use panel-open or panel-close)
      - drawer (use open-drawer-left or open-drawer-right)

  - name: rh-ui-icon-speedometer
    icon: speedometer
    description: "Gauge dial — a performance, utilization, or metric indicator."
    accepted_metaphors:
      - performance metric
      - utilization gauge
      - dashboard KPI
      - speed or throughput indicator
      - benchmark or threshold
    rejected_metaphors:
      - proportional data (use pie-chart)
      - trend over time (use trend-up or trend-down)
      - completion percentage (use harvey-ball-*)

