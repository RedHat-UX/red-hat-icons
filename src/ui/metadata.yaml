 # ── Arrows ─────────────────────────────────────────────────────────────────
 # Three arrow weights: plain (bare arrowhead), circle (arrowhead in a ring —
 # higher visual weight, suits primary CTAs), and long (elongated shaft —
 # stronger directional emphasis). Use the weight that matches the UI context.
 # Carets (single-step, chevron-style navigation) are in the Framework section.

 - name: rh-ui-icon-arrow-down
   icon: arrow-down
   description: "Arrow pointing down — represents move, scroll, or navigate down."
   accepted_metaphors:
    - move down
    - scroll down
    - navigate down
    - collapse (paired with arrow-up)
    - sort descending
   rejected_metaphors:
    - download (use download or cloud-download icon)
    - dropdown expand (use caret-down icon)
    - decrease in value (use decreasing or trend-down icon)

 - name: rh-ui-icon-arrow-up
   icon: arrow-up
   description: "Arrow pointing up — represents move, scroll, or navigate up."
   accepted_metaphors:
    - move up
    - scroll up
    - navigate up
    - expand (paired with arrow-down)
    - sort ascending
   rejected_metaphors:
    - upload (use upload or cloud-upload icon)
    - dropdown collapse (use caret-up icon)
    - increase in value (use increasing or trend-up icon)

 - name: rh-ui-icon-arrow-left
   icon: arrow-left
   description: "Arrow pointing left — represents move, navigate, or go back."
   accepted_metaphors:
    - navigate back
    - go left
    - previous step
    - move left
   rejected_metaphors:
    - undo (use undo icon)
    - collapse panel (use caret-left or panel-close icon)
    - previous page pagination (use long-arrow-left for stronger emphasis icon)

 - name: rh-ui-icon-arrow-right
   icon: arrow-right
   description: "Arrow pointing right — represents move, navigate, or proceed forward."
   accepted_metaphors:
    - navigate forward
    - go right
    - next step
    - proceed
    - submit or continue
   rejected_metaphors:
    - redo (use redo icon)
    - expand panel (use caret-right or panel-open icon)
    - external link (use external-link icon)

 - name: rh-ui-icon-arrow-up-down
   icon: arrow-up-down
   description: "Bidirectional vertical arrows — represents resize vertically, reorder, or indicate a sortable column."
   accepted_metaphors:
    - vertical resize
    - drag to reorder
    - sortable column
    - height adjustment
    - swap vertically
   rejected_metaphors:
    - sort ascending or descending specifically (use sort-up-* or sort-down-* icons)
    - scroll (use arrow-up / arrow-down icon)

 - name: rh-ui-icon-arrow-left-right
   icon: arrow-left-right
   description: "Bidirectional horizontal arrows — represents resize horizontally, compare, or indicate a draggable boundary."
   accepted_metaphors:
    - horizontal resize
    - drag to resize
    - width adjustment
    - compare left and right
    - draggable divider
   rejected_metaphors:
    - swap or transfer (use swap-right-left icon)
    - scroll left or right

 - name: rh-ui-icon-arrow-up-left
   icon: arrow-up-left
   description: "Arrow pointing diagonally to the top-left."
   accepted_metaphors:
    - move up and left
    - navigate to upper-left corner
    - diagonal up-left direction
   rejected_metaphors:
    - back navigation (use arrow-left icon)
    - collapse (use compress or arrow-down-left-up-right-to-center icon)

 - name: rh-ui-icon-arrow-up-right
   icon: arrow-up-right
   description: "Arrow pointing diagonally to the top-right."
   accepted_metaphors:
    - move up and right
    - navigate to upper-right corner
    - diagonal up-right direction
   rejected_metaphors:
    - external link (use external-link icon)
    - expand (use arrow-up-right-down-left-from-center icon)

 - name: rh-ui-icon-arrow-down-left
   icon: arrow-down-left
   description: "Arrow pointing diagonally to the bottom-left."
   accepted_metaphors:
    - move down and left
    - navigate to lower-left corner
    - diagonal down-left direction
   rejected_metaphors:
    - collapse (use arrow-down-left-up-right-to-center icon)
    - back navigation (use arrow-left icon)

 - name: rh-ui-icon-arrow-down-right
   icon: arrow-down-right
   description: "Arrow pointing diagonally to the bottom-right."
   accepted_metaphors:
    - move down and right
    - navigate to lower-right corner
    - diagonal down-right direction
   rejected_metaphors:
    - expand (use arrow-up-right-down-left-from-center icon)
