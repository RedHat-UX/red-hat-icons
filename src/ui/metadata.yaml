 # ── Harvey balls ───────────────────────────────────────────────────────────
 # Harvey balls are circle-fill completion indicators used in roadmaps,
 # scorecards, and status tables. Pick the icon matching the exact percentage.
 # For binary done/not-done states, use check-circle or not-started instead.
 - name: rh-ui-icon-harvey-ball-0
   icon: harvey-ball-0
   description: "Empty circle — represents 0% complete or not yet started."
   accepted_metaphors:
    - 0% completion
    - not started
    - no progress
    - empty capacity
   rejected_metaphors:
    - binary not-started status (use not-started icon)
    - pie chart data (use pie-chart icon)
    - off state (use off icon)

 - name: rh-ui-icon-harvey-ball-10
