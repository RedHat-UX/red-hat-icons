  # ── Harvey balls ───────────────────────────────────────────────────────────
  # Harvey balls are circle-fill completion indicators used in roadmaps,
  # scorecards, and status tables. Pick the icon matching the exact percentage.
  # For binary done/not-done states, use check-circle or not-started instead.
  - name: rh-ui-icon-harvey-ball-0
    icon: harvey-ball-0
    description: "Empty circle — 0% complete or not yet started."
    accepted_metaphors:
