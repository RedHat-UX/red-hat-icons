  # ── Arrows ─────────────────────────────────────────────────────────────────
  # Three arrow weights: plain (bare arrowhead), circle (arrowhead in a ring —
  # higher visual weight, suits primary CTAs), and long (elongated shaft —
  # stronger directional emphasis). Use the weight that matches the UI context.
  # Carets (single-step, chevron-style navigation) are in the Framework section.

  - name: rh-ui-icon-arrow-down
    icon: arrow-down
    description: "Downward arrowhead — move, scroll, or navigate down."
    accepted_metaphors:
      - move down
      - scroll down
      - navigate down
      - collapse (paired with arrow-up)
      - sort descending
    rejected_metaphors:
      - download (use download or cloud-download)
      - dropdown expand (use caret-down)
      - decrease in value (use decreasing or trend-down)

  - name: rh-ui-icon-arrow-up
    icon: arrow-up
    description: "Upward arrowhead — move, scroll, or navigate up."
    accepted_metaphors:
      - move up
      - scroll up
      - navigate up
      - expand (paired with arrow-down)
      - sort ascending
    rejected_metaphors:
      - upload (use upload or cloud-upload)
      - dropdown collapse (use caret-up)
      - increase in value (use increasing or trend-up)

  - name: rh-ui-icon-arrow-left
    icon: arrow-left
    description: "Leftward arrowhead — move, navigate, or go back."
    accepted_metaphors:
      - navigate back
      - go left
      - previous step
      - move left
    rejected_metaphors:
      - undo (use undo)
      - collapse panel (use caret-left or panel-close)
      - previous page pagination (use long-arrow-left for stronger emphasis)

  - name: rh-ui-icon-arrow-right
    icon: arrow-right
    description: "Rightward arrowhead — move, navigate, or proceed forward."
    accepted_metaphors:
      - navigate forward
      - go right
      - next step
      - proceed
      - submit or continue
    rejected_metaphors:
      - redo (use redo)
      - expand panel (use caret-right or panel-open)
      - external link (use external-link)

  - name: rh-ui-icon-arrow-up-down
    icon: arrow-up-down
    description: "Bidirectional vertical arrows — resize vertically, reorder, or indicate a sortable column."
    accepted_metaphors:
      - vertical resize
      - drag to reorder
      - sortable column
      - height adjustment
      - swap vertically
    rejected_metaphors:
      - sort ascending or descending specifically (use sort-up-* or sort-down-*)
      - scroll (use arrow-up / arrow-down)

  - name: rh-ui-icon-arrow-left-right
    icon: arrow-left-right
    description: "Bidirectional horizontal arrows — resize horizontally, compare, or indicate a draggable boundary."
    accepted_metaphors:
      - horizontal resize
      - drag to resize
      - width adjustment
      - compare left and right
      - draggable divider
    rejected_metaphors:
      - swap or transfer (use swap-right-left)
      - scroll left or right

  - name: rh-ui-icon-arrow-up-left
    icon: arrow-up-left
    description: "Diagonal arrowhead pointing up-left."
    accepted_metaphors:
      - move up and left
      - navigate to upper-left corner
      - diagonal up-left direction
    rejected_metaphors:
      - back navigation (use arrow-left)
      - collapse (use compress or arrow-down-left-up-right-to-center)

  - name: rh-ui-icon-arrow-up-right
