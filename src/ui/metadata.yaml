 # ── Status ─────────────────────────────────────────────────────────────────
 # Status icons communicate the current state of a system, process, resource,
 # or connection. Use them consistently so users can identify states at a
 # glance without reading labels. Pair with color tokens and accessible labels.

 # — System power and process state ——————————————————————————————————————————

 - name: rh-ui-icon-asleep
   icon: asleep
   description: "Crescent moon in a circle — represents a system, device, or service is in a sleep or standby state."
   accepted_metaphors:
    - sleep or standby
    - hibernating
    - idle low-power state
    - suspended service
   rejected_metaphors:
    - powered off (use off icon)
    - dark mode (use dark-mode icon)
    - paused process (use pending or not-started icon)

 - name: rh-ui-icon-asleep-fill
   icon: asleep-fill
   description: "Crescent moon in a filled circle — represents emphasized system, device, or service is in a sleep or standby state."
   accepted_metaphors:
    - sleep or standby
    - hibernating
    - idle low-power state
    - suspended service
   rejected_metaphors:
    - powered off (use off icon)
    - dark mode (use dark-mode icon)
    - paused process (use pending or not-started icon)

 - name: rh-ui-icon-in-progress
   icon: in-progress
   description: "Spinning or partial circle — represents a task or process is actively running."
   accepted_metaphors:
    - in progress
    - loading or processing
    - running task
    - pending execution
   rejected_metaphors:
    - in-progress with passing check (use in-progress-check icon)
    - not yet started (use not-started icon)
    - complete (use check-circle icon)

 - name: rh-ui-icon-in-progress-check
   icon: in-progress-check
   description: "Partial circle with a check — represents a process is running and passing its health checks."
   accepted_metaphors:
    - running and healthy
    - in-progress and validated
    - active and passing
   rejected_metaphors:
    - simple in-progress without validation (use in-progress icon)
    - complete (use check-circle icon)
    - error while running (use error icon)

 - name: rh-ui-icon-not-started
   icon: not-started
   description: "Circle with a horizontal line of three dots — represents a task or item that has not yet begun."
   accepted_metaphors:
    - not started
    - backlog or queued
    - pending (not yet active)
    - open item
   rejected_metaphors:
    - actively processing (use in-progress icon)
    - paused or waiting (use pending icon)
    - complete (use check-circle icon)

 - name: rh-ui-icon-not-started-fill
   icon: not-started-fill
   description: "Filled circle with a horizontal line of three dots — represents emphasized task or item that has not yet begun."
   accepted_metaphors:
    - not started
    - backlog or queued
    - pending (not yet active)
    - open item
   rejected_metaphors:
    - actively processing (use in-progress icon)
    - paused or waiting (use pending icon)
    - complete (use check-circle icon)

 - name: rh-ui-icon-off
   icon: off
   description: "Circle with vertical line in center — represents a system, service, or toggle is turned off."
   accepted_metaphors:
    - powered off
    - disabled or deactivated
    - toggle off
    - stopped service
   rejected_metaphors:
    - sleep or standby (use asleep icon)
    - close a dialog (use close icon)
    - in-progress (use in-progress icon)

 - name: rh-ui-icon-off-fill
   icon: off-fill
   description: "Filled circle with vertical line in center — represents emphasized system, service, or toggle is turned off."
   accepted_metaphors:
    - powered off
    - disabled or deactivated
    - toggle off
    - stopped service
   rejected_metaphors:
    - sleep or standby (use asleep icon)
    - close a dialog (use close icon)
    - in-progress (use in-progress icon)

 - name: rh-ui-icon-pending
   icon: pending
   description: "Hourglass — represents an item is queued or waiting to proceed."
   accepted_metaphors:
    - pending or queued
    - waiting to start
    - on hold
    - scheduled for later
   rejected_metaphors:
    - not yet scheduled (use not-started icon)
    - actively running (use in-progress icon)
    - clock or time setting (use clock icon)

 - name: rh-ui-icon-running
   icon: running
   description: "Horizontal line with a single heartbeat pulse spike in the middle. — represents a service, job, or process is actively running."
   accepted_metaphors:
    - running
    - active or live
    - executing
    - operational
   rejected_metaphors:
    - in-progress task (use in-progress icon)
    - process with health check (use in-progress-check icon)
    - starting or pending (use pending or not-started icon)

