  # Action icons represent things a user can do — create, edit, delete, share,
  # navigate, and more. Use them on buttons, toolbars, and contextual menus.

  # — Create and add ——————————————————————————————————————————————————————————

  - name: rh-ui-icon-add
    icon: add
    description: "Plus sign — add or create something."
    accepted_metaphors:
      - add item
      - create new
      - insert
      - increase count
    rejected_metaphors:
      - add in a circle (use add-circle)
      - add in a square (use add-square)
      - expand panel (use expand)

  - name: rh-ui-icon-add-circle
    icon: add-circle
    description: "Plus sign in a circle — add or create, emphasized with a circular container."
    accepted_metaphors:
      - add (circular button)
      - create new
      - insert (prominent)
    rejected_metaphors:
      - plain add (use add)
      - add in a square (use add-square)

  - name: rh-ui-icon-add-circle-fill
    icon: add-circle-fill
    description: "Filled plus circle — add or create (filled variant)."
    accepted_metaphors:
      - add (filled circle)
    rejected_metaphors:
      - plain add (use add)

  - name: rh-ui-icon-add-square
    icon: add-square
    description: "Plus sign in a square — add or create, in a square container."
    accepted_metaphors:
      - add (square button)
      - create new
      - insert (square context)
    rejected_metaphors:
      - add in a circle (use add-circle)
      - plain add (use add)

  - name: rh-ui-icon-add-square-fill
    icon: add-square-fill
    description: "Filled plus square — add or create (filled square variant)."
    accepted_metaphors:
      - add (filled square)
    rejected_metaphors:
      - plain add (use add)

  - name: rh-ui-icon-duplicate
    icon: duplicate
    description: "Two overlapping documents — duplicate or clone an item."
    accepted_metaphors:
      - duplicate
      - clone
      - copy as new
      - replicate
    rejected_metaphors:
      - copy to clipboard (use copy)
      - export (use export)
      - save as (use save)

  - name: rh-ui-icon-duplicate-fill
    icon: duplicate-fill
    description: "Filled overlapping documents — duplicate (filled variant)."
    accepted_metaphors:
      - duplicate (filled)
    rejected_metaphors:
      - copy to clipboard (use copy)

  # — Delete and remove ———————————————————————————————————————————————————————

  - name: rh-ui-icon-close
    icon: close
    description: "X mark — dismiss, close, or remove something."
    accepted_metaphors:
      - close dialog or modal
      - dismiss notification
      - remove tag or chip
      - cancel action
      - clear input
    rejected_metaphors:
      - delete to trash (use trash)
      - error state (use error)
      - ban or block (use ban)
